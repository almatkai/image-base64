[package]
name = "image-base64-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/almatkai/image-base64"
description = "Standalone Image Base64 Converter for Tezbar"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process"] }
base64 = "=0.22.1"
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[[bin]]
name = "image-base64"
path = "src/main.rs"

[dev-dependencies]
sha2 = "=0.10.9"
walkdir = "=2.5.0"
semver = "=1.0.27"
# Cargo.lock retains zopfli 0.8.2 for QA compatibility with Rust 1.85.
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
